<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FATIMATA マイページ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px 48px;
      background: #fff;
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }
    .page {
      width: min(100%, 560px);
      margin: 0 auto;
    }
    #status {
      margin: 0 0 28px;
      font-size: clamp(22px, 5.5vw, 28px);
      font-weight: 700;
      line-height: 1.5;
    }
    #link-form {
      display: grid;
      gap: 14px;
    }
    #link-form[hidden] { display: none; }
    label {
      font-size: 20px;
      font-weight: 700;
    }
    input, button {
      width: 100%;
      min-height: 56px;
      border-radius: 12px;
      font: inherit;
    }
    input {
      padding: 12px 14px;
      border: 2px solid #c7c7c7;
      background: #fff;
      color: #202124;
    }
    input:focus {
      border-color: #111;
      outline: 3px solid rgba(0, 0, 0, 0.15);
      outline-offset: 2px;
    }
    button {
      padding: 12px 18px;
      border: 0;
      background: #111;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    #nickname-fallback {
      display: flex;
      width: 100%;
      min-height: 56px;
      margin-top: 18px;
      padding: 12px 18px;
      align-items: center;
      justify-content: center;
      border: 2px solid #111;
      border-radius: 12px;
      background: #fff;
      color: #111;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }
    #nickname-fallback[hidden] { display: none; }
    @media (max-width: 420px) {
      body { padding: 24px 16px 40px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p id="status">LINE本人確認を開始しています。</p>
    <form id="link-form" hidden>
      <label for="link-code">連携コード</label>
      <input id="link-code" autocomplete="one-time-code" placeholder="例：A1B2C3-D4E5F6-A1B2C3-D4E5F6">
      <button type="submit">このLINEを連携する</button>
    </form>
    <a id="nickname-fallback" href="https://script.google.com/macros/s/AKfycbw4OxzWgFUEAlkP6KF414oCQgF54Y7okG4fhd_0nMCfew5YBJYqqekt2XlvErlmnj0_/exec?page=ticket" target="_top" rel="noreferrer" hidden>ニックネームでマイページを開く</a>
  </main>
  <script src="./config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
const bridge = window.LIFF_BRIDGE_CONFIG || {};
const HANDOFF_URL = 'https://script.google.com/macros/s/AKfycbw4OxzWgFUEAlkP6KF414oCQgF54Y7okG4fhd_0nMCfew5YBJYqqekt2XlvErlmnj0_/exec';
const TICKET_URL = HANDOFF_URL + '?page=ticket';
const BOOKING_URL = HANDOFF_URL + '?page=booking';
const status = document.getElementById('status');
const nicknameFallback = document.getElementById('nickname-fallback');
const requestedPurpose = new URLSearchParams(location.search).get('purpose');
const purpose = requestedPurpose === 'booking' ? 'booking' : requestedPurpose === 'event' ? 'event' : 'ticket';
if (purpose === 'booking') { nicknameFallback.href=BOOKING_URL; nicknameFallback.textContent='ニックネームで予約ページを開く'; }
function showNicknameFallback() { nicknameFallback.hidden=false; }
function post(route, values) { const form = document.createElement('form'); form.method='post'; form.action=HANDOFF_URL; form.target='_self'; Object.entries(Object.assign({route}, values)).forEach(([name,value])=>{ const input=document.createElement('input'); input.type='hidden'; input.name=name; input.value=value; form.appendChild(input); }); document.body.appendChild(form); form.submit(); }
async function start() { try { if (!bridge.liffId) throw new Error('config'); await liff.init({liffId:bridge.liffId}); const idToken=liff.getIDToken(); if (!idToken) throw new Error('id_token'); if (purpose === 'booking') post('line_handoff',{id_token:idToken,purpose:'booking'}); else if(purpose === 'event') post('line_handoff',{id_token:idToken,purpose:'event'}); else post('line_handoff',{id_token:idToken}); } catch (_) { status.textContent=purpose === 'booking' ? 'LINE本人確認を開始できませんでした。ニックネームでも予約ページを開けます。' : 'LINE本人確認を開始できませんでした。ニックネームでもマイページを開けます。'; if(purpose === 'event') status.textContent='LINEで本人確認できませんでした。LINEからイベントの入口を開き直してください。'; else showNicknameFallback(); } }
const linkSession = new URLSearchParams(location.search).get('link_session');
if (linkSession) { status.textContent=new URLSearchParams(location.search).get('link_error') || '初回のみ、FATIMATAから受け取った連携コードを入力してください。'; const form=document.getElementById('link-form'); form.hidden=false; if(purpose !== 'event') showNicknameFallback(); form.addEventListener('submit', event=>{ event.preventDefault(); const code=document.getElementById('link-code').value.trim(); if (!code) return; post('line_link',Object.assign({link_session:linkSession,link_code:code},purpose === 'event'?{purpose:'event'}:{})); }); } else start();
  </script>
</body>
</html>
