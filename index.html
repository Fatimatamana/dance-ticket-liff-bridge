<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FATIMATA マイページ</title><body><p id="status">LINE本人確認を開始しています。</p><form id="link-form" hidden><label for="link-code">連携コード</label><input id="link-code" autocomplete="one-time-code" placeholder="例：A1B2C3-D4E5F6-A1B2C3-D4E5F6"><button>このLINEを連携する</button></form><script src="./config.js"></script><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const bridge = window.LIFF_BRIDGE_CONFIG || {};
const HANDOFF_URL = 'https://script.google.com/macros/s/AKfycbw4OxzWgFUEAlkP6KF414oCQgF54Y7okG4fhd_0nMCfew5YBJYqqekt2XlvErlmnj0_/exec';
const status = document.getElementById('status');
function post(route, values) { const form = document.createElement('form'); form.method='post'; form.action=HANDOFF_URL; form.target='_self'; Object.entries(Object.assign({route}, values)).forEach(([name,value])=>{ const input=document.createElement('input'); input.type='hidden'; input.name=name; input.value=value; form.appendChild(input); }); document.body.appendChild(form); form.submit(); }
async function start() { try { if (!bridge.liffId) throw new Error('config'); await liff.init({liffId:bridge.liffId}); const idToken=liff.getIDToken(); if (!idToken) throw new Error('id_token'); post('line_handoff',{id_token:idToken}); } catch (_) { status.textContent='LINE本人確認を開始できませんでした。LINEからもう一度開いてください。'; } }
const linkSession = new URLSearchParams(location.search).get('link_session');
if (linkSession) { status.textContent=new URLSearchParams(location.search).get('link_error') || '初回のみ、FATIMATAから受け取った連携コードを入力してください。'; const form=document.getElementById('link-form'); form.hidden=false; form.addEventListener('submit', event=>{ event.preventDefault(); const code=document.getElementById('link-code').value.trim(); if (!code) return; post('line_link',{link_session:linkSession,link_code:code}); }); } else start();
</script></body></html>
